<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ODY Q&amp;A · 01 기획</title>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* ===== S1 : 기존 추천 vs ODY ===== */
  .cmp{display:grid;grid-template-columns:1fr 92px 1fr;align-items:stretch;gap:0;height:560px}
  .cmp .card{height:100%;display:flex;flex-direction:column}
  .cmp-arrow{display:grid;place-items:center}
  .cmp-arrow svg{overflow:visible}
  .panel-t{font-size:36px;font-weight:800;margin-bottom:26px}
  .genres{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1}
  .genre{background:#EDEEF4;border-radius:14px;padding:20px 0 24px;display:flex;flex-direction:column;align-items:center}
  .genre-n{font-size:29px;font-weight:700;color:var(--ink);margin-bottom:18px}
  .gdots{display:grid;grid-template-columns:repeat(3,18px);gap:16px 20px}
  .gdots i{width:18px;height:18px;border-radius:50%;display:block}
  .person{width:22px;height:34px;margin-top:20px;position:relative}
  .person::before{content:'';position:absolute;top:0;left:4px;width:14px;height:14px;border-radius:50%;background:var(--ink)}
  .person::after{content:'';position:absolute;bottom:0;left:0;width:22px;height:15px;border-radius:11px 11px 4px 4px;background:var(--ink)}
  .cap{font-size:30px;font-weight:700;text-align:center;margin-top:20px}

  /* ===== S2 : 사용자 여정 ===== */
  .steps{display:grid;grid-template-columns:repeat(6,1fr);gap:0;align-items:start;margin-top:14px}
  .step{text-align:center;position:relative}
  .step .arr{position:absolute;top:52px;right:-22px;width:44px;height:2px;background:#C8CCDA}
  .step .arr::after{content:'';position:absolute;right:0;top:-4px;border-left:9px solid #C8CCDA;border-top:5px solid transparent;border-bottom:5px solid transparent}
  .step .lbl{font-size:28px;font-weight:800;margin-top:22px}
  .step .box{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:20px 8px;font-size:25px;font-weight:700;margin-top:24px}
  .step .tag{display:inline-block;margin-top:16px;border-radius:999px;padding:9px 20px;font-size:21px;font-weight:700}

  /* ===== S3 : 결정 여섯 가지 ===== */
  .dec{display:grid;grid-template-columns:330px 96px 330px 1fr;align-items:center;gap:16px 0;row-gap:20px}
  .dec .old{background:#EDEEF4;border-radius:12px;padding:18px 24px;font-size:26px;font-weight:700;color:#7C8196;text-decoration:line-through;text-decoration-color:#B4B8C8;text-align:center}
  .dec .arr2{height:2px;background:var(--indigo);position:relative;margin:0 18px}
  .dec .arr2::after{content:'';position:absolute;right:0;top:-5px;border-left:10px solid var(--indigo);border-top:6px solid transparent;border-bottom:6px solid transparent}
  .dec .new{background:var(--indigo);color:#fff;border-radius:12px;padding:18px 24px;font-size:26px;font-weight:800;text-align:center}
  .dec .why{font-size:25px;font-weight:600;color:var(--ink2);padding-left:34px}

  /* ===== S4 : 음원 비저장 ===== */
  .fl{display:grid;grid-template-columns:1fr 62px 1fr 62px 1fr 62px 200px;align-items:center;margin-bottom:30px}
  .fl .bx{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:30px 20px;text-align:center;font-size:28px;font-weight:700;line-height:1.35;min-height:118px;display:grid;place-items:center}
  .fl .bx.ind{color:var(--indigo);font-weight:800}
  .fl .bx.dk{background:var(--dark);color:#fff;border-color:var(--dark);font-size:26px}
  .fl .ar{height:2px;background:#C8CCDA;margin:0 14px;position:relative}
  .fl .ar::after{content:'';position:absolute;right:0;top:-4px;border-left:9px solid #C8CCDA;border-top:5px solid transparent;border-bottom:5px solid transparent}
  .fl .side{font-size:24px;font-weight:600;color:var(--ink2);padding-left:24px}
  .xmark{position:absolute;top:-16px;right:-14px;font-size:45px;font-weight:800;color:var(--orange);line-height:1}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:8px;text-align:left}

  /* ===== S5 : 한계 ===== */
  .lim{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  .lim .card{padding:30px 32px}
  .lim .t{display:flex;align-items:center;gap:12px;font-size:34px;font-weight:800}
  .lim .t::before{content:'';width:13px;height:13px;border-radius:50%;background:var(--orange);flex:none}
  .lim .s{font-size:28px;font-weight:600;color:var(--ink2);margin:16px 0 22px}
  .lim .nx{background:#E9ECFF;color:var(--indigo);border-radius:12px;padding:14px 20px;font-size:28px;font-weight:700}
  .steps.big{margin-top:96px !important}
  .steps.big .dot-n{width:140px;height:140px;font-size:60px}
  .steps.big .arr{top:70px}
  .steps.big .lbl{font-size:33px;margin-top:30px}
  .steps.big .box{padding:58px 10px;margin-top:36px;font-size:31px}
  .steps.big .tag{margin-top:28px;font-size:26px;padding:12px 24px}
  .fl.big .bx{min-height:126px;font-size:31px}
</style>
</head>
<body>
<div class="prog"></div>

<div class="stage">
<div class="deck">

<!-- ================= S1 ================= -->
<section class="slide">
  <div class="head">
    <div class="eyebrow" data-a="fd">Q. 음원 저작권 문제는 어떻게 해결했나요?</div>
    <h2 class="title" data-a="fu" style="--d:.1s">음원은 <span class="acc">한 곡도</span> 저장하지 않는다</h2>
  </div>

  <div class="fill-lg" style="margin-top:20px;display:grid;align-content:center">
    <div class="fl big">
      <div class="bx" data-a="fu" style="position:relative; --d:.24s">음원 파일<span class="xmark">✕</span></div>
      <div class="ar" data-a="fi" style="--d:.3s"></div>
      <div class="bx ind" data-a="fu" style="--d:.34s">소리 분석 숫자<br>2,900개</div>
      <div class="ar" data-a="fi" style="--d:.4s"></div>
      <div class="bx ind" data-a="fu" style="--d:.44s">지도 좌표</div>
      <div></div>
      <div class="side" data-a="fi" style="--d:.5s">지도 만들기</div>
    </div>
    <div class="fl big" style="margin-bottom:12px">
      <div class="bx" data-a="fu" style="--d:.54s">곡 이름</div>
      <div class="ar" data-a="fi" style="--d:.6s"></div>
      <div class="bx" data-a="fu" style="--d:.64s">YouTube 검색<br>+ 재생 가능 확인</div>
      <div class="ar" data-a="fi" style="--d:.7s"></div>
      <div class="bx ind" data-a="fu" style="--d:.74s">영상 ID만 저장</div>
      <div class="ar" data-a="fi" style="--d:.8s"></div>
      <div class="bx dk" data-a="fu" style="--d:.84s">공식<br>플레이어</div>
    </div>

    <div class="nums" style="margin-top:6px">
      <div data-a="fu" style="--d:.95s"><div class="big acc">0곡</div><div class="big-cap">음원 파일 저장 · 오디오 자체는 서버에 없음</div></div>
      <div data-a="fu" style="--d:1.05s"><div class="big k">2,900</div><div class="big-cap">소리 분석 숫자 · 공개 데이터의 측정값만 사용</div></div>
      <div data-a="fu" style="--d:1.15s"><div class="big acc-t">ID</div><div class="big-cap">YouTube 영상 ID만 · 공식 플레이어로 재생</div></div>
    </div>
  </div>
  <div class="concl" data-a="fu">공개된 분석 숫자로 지도를 만들고, 재생은 공식 플레이어에 맡기는 구조</div>
  <div class="pnum">1</div>
</section>

</div>
</div>

<div class="nav">
  <button data-prev aria-label="이전">←</button>
  <span class="counter">1 / 1</span>
  <button data-next aria-label="다음">→</button>
</div>

<script src="assets/deck.js"></script>
<script>
// S1 산점도 (결정론적)
(function(){
  const g = document.getElementById('s1-scatter');
  if(!g) return;
  const r = ODY.rng(99);
  const cols = ['#98A4FF','#F09D6B','#2AA38B','#C3CAFF','#7FD6C4'];
  let html = '';
  for(let i=0;i<58;i++){
    const x = 30 + r()*500, y = 24 + r()*286;
    const rad = 5 + r()*4;
    html += '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+rad.toFixed(1)+'" fill="'+cols[Math.floor(r()*cols.length)]+'" opacity="'+(0.55+r()*0.4).toFixed(2)+'"/>';
  }
  g.innerHTML = html;
  g.setAttribute('data-a','fi');
  g.style.setProperty('--d','.6s');
})();
ODY.initDeck({backHref:'index.html#planning'});
</script>
</body>
</html>
